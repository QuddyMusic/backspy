# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backspy"
version = "1.0.0"
description = "Python bot library for Backspace instances"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["backspy*"]